<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Premium - newr.my.id</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 10px; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background: #1d4ed8; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>AM Generator</h2>
        <div id="step1">
            <input type="email" id="email" placeholder="Email Alight Motion">
            <button onclick="sendLink()">Kirim Magic Link</button>
        </div>
        <div id="step2" class="hidden">
            <p>Cek email lu, copy link verifikasinya, paste di sini:</p>
            <textarea id="magicLink" rows="4" style="width:100%; padding:10px; border-radius:5px;"></textarea>
            <button onclick="activate()">Aktivasi Premium</button>
        </div>
        <div id="step3" class="hidden">
            <h3>🎉 Sukses!</h3>
            <p>Akun lu udah Premium. Buka app Alight Motion, logout, terus login lagi pakai email tadi.</p>
        </div>
    </div>

    <script>
        async function sendLink() {
            const email = document.getElementById('email').value;
            const res = await fetch('/api/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                alert('Link terkirim! Cek inbox/spam.');
            } else { alert('Gagal: ' + data.error); }
        }

        async function activate() {
            const link = document.getElementById('magicLink').value;
            const res = await fetch('/api/activate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({link})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
            } else { alert('Gagal: ' + data.error); }
        }
    </script>
</body>
</html>
