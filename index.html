<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM Premium - newr.my.id</title>
<style>
  body { font-family: sans-serif; background:#0f172a; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
  .box { background:#1e293b; padding:30px; border-radius:10px; width:320px; text-align:center; }
  input, textarea { width:100%; padding:10px; margin:10px 0; border-radius:5px; border:none; box-sizing:border-box; }
  button { background:#2563eb; color:#fff; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; width:100%; }
  .hidden { display:none; }
  #status { color:#94a3b8; font-size:12px; min-height:32px; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="box">
  <h2>AM Generator</h2>
  <div id="step1">
    <input type="email" id="email" placeholder="Email Alight Motion">
    <button onclick="sendLink()">Kirim Magic Link</button>
  </div>
  <div id="step2" class="hidden">
    <p style="font-size:13px">Paste SELURUH link dari email (boleh ada enter/spasi, aman):</p>
    <textarea id="magicLink" rows="4"></textarea>
    <button onclick="activate()">Aktivasi</button>
  </div>
  <div id="step3" class="hidden">
    <h3>PREMIUM INJECTED</h3>
    <p>Kode Order: <b id="order"></b></p>
    <p style="font-size:12px">Buka app Alight Motion, login pakai email ini (sign in with email link), premium udah nempel.</p>
  </div>
  <p id="status"></p>
</div>
<script>
const $ = id => document.getElementById(id);
const log = m => $('status').textContent = m;
let EMAIL = '';

async function sendLink() {
  EMAIL = $('email').value.trim();
  if (!EMAIL) return log('Isi email dulu.');
  log('Minta link ke server Alight Motion...');
  try {
    const res = await fetch('/api/send', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: EMAIL })
    });
    const data = await res.json();
    if (!data.success) throw new Error(JSON.stringify(data.error));
    localStorage.setItem('am_email', EMAIL);
    $('step1').classList.add('hidden');
    $('step2').classList.remove('hidden');
    log('Terkirim. Cek inbox/spam.');
  } catch (e) { log('GAGAL: ' + e.message); }
}

async function activate() {
  const email = EMAIL || localStorage.getItem('am_email') || $('email').value.trim();
  const link = $('magicLink').value;
  if (!link.trim()) return log('Paste link dulu.');
  log('Menembus server verifyPurchase Alight...');
  try {
    const res = await fetch('/api/activate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: email, magicLink: link })
    });
    const data = await res.json();
    if (!data.success) throw new Error(JSON.stringify(data.error));
    $('step2').classList.add('hidden');
    $('step3').classList.remove('hidden');
    $('order').textContent = data.orderId || '-';
    log('');
  } catch (e) { log('GAGAL: ' + e.message); }
}
</script>
</body>
</html>
