<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM Premium - newr.my.id</title>
<style>
  body { font-family: sans-serif; background:#0f172a; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
  .box { background:#1e293b; padding:30px; border-radius:10px; width:320px; text-align:center; }
  input, textarea { width:100%; padding:10px; margin:10px 0; border-radius:5px; border:none; box-sizing:border-box; }
  button { background:#2563eb; color:#fff; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; width:100%; }
  .hidden { display:none; }
  #status { color:#94a3b8; font-size:12px; min-height:16px; }
</style>
</head>
<body>
<div class="box">
  <h2>AM Generator</h2>
  <div id="step1">
    <input type="email" id="email" placeholder="Email Alight Motion">
    <button onclick="sendLink()">Kirim Magic Link</button>
  </div>
  <div id="step2" class="hidden">
    <p style="font-size:13px">Link terkirim. Buka dari email di HP ini, atau copy linknya dan paste:</p>
    <textarea id="magicLink" rows="3"></textarea>
    <button onclick="pasteFlow()">Aktivasi</button>
  </div>
  <div id="step3" class="hidden">
    <h3>PREMIUM AKTIF</h3>
    <p>Kode Order: <b id="order"></b></p>
    <p id="claim"></p>
  </div>
  <p id="status"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAtQgxzTYD7y-AttGJY314sqjRA6QHLNyw",
  authDomain: "newr-amprem.firebaseapp.com",
  projectId: "newr-amprem",
  storageBucket: "newr-amprem.firebasestorage.app",
  messagingSenderId: "728332958014",
  appId: "1:728332958014:web:909aecf300fa40c33f146f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const $ = id => document.getElementById(id);
const log = m => $('status').textContent = m;

// Kalau user klik link langsung dari email di HP yang sama, auto-proses
if (auth.isSignInWithEmailLink(window.location.href)) {
  const email = localStorage.getItem('emailForSignIn') || prompt('Email yang lu daftarin?');
  finishSignIn(email, window.location.href);
}

async function sendLink() {
  const email = $('email').value.trim();
  if (!email) return log('Isi email dulu.');
  log('Mengirim link dari server Firebase...');
  try {
    await auth.sendSignInLinkToEmail(email, {
      url: 'https://newr.my.id/',
      handleCodeInApp: true
    });
    localStorage.setItem('emailForSignIn', email);
    $('step1').classList.add('hidden');
    $('step2').classList.remove('hidden');
    log('Terkirim. Cek inbox + folder spam/promosi.');
  } catch (e) {
    log('GAGAL: ' + e.message);
  }
}

async function pasteFlow() {
  const email = localStorage.getItem('emailForSignIn') || $('email').value.trim();
  const link = $('magicLink').value.trim();
  if (!auth.isSignInWithEmailLink(link)) return log('Link tidak valid.');
  finishSignIn(email, link);
}

async function finishSignIn(email, link) {
  log('Verifikasi link + inject claims...');
  try {
    await auth.signInWithEmailLink(email, link);
    const token = await auth.currentUser.getIdToken();
    const res = await fetch('/api/activate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    const result = await auth.currentUser.getIdTokenResult(true);
    $('step1').classList.add('hidden');
    $('step2').classList.add('hidden');
    $('step3').classList.remove('hidden');
    $('order').textContent = data.orderId;
    $('claim').textContent = 'Status claims premium: ' + (result.claims.premium === true);
    log('');
  } catch (e) {
    log('GAGAL: ' + e.message);
  }
}
</script>
</body>
</html>
